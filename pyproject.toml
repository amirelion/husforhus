[project]
name = "husforhus-pipeline"
version = "0.1.0"
description = "Hus för hus (Stockholm, building by building): the data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
# Pinned to ruff's classic default set. Ruff 0.17 widened the default to about 400 rules.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: downloads real data; enabled with --network or HFH_NETWORK=1",
]

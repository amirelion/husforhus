name: Network

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  network:
    # The tests marked @pytest.mark.network. They download the City LOD1 zip into data/cache (kept between runs
    # below) and send requests to the City, RAÄ and Wikidata servers. The `e2e` job below runs next to it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HFH_NETWORK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Cache downloaded test data
        uses: actions/cache@v6
        with:
          path: data/cache
          key: lod1-${{ hashFiles('tests/conftest.py') }}

      - name: Cache raw data  # same key as the e2e job below, whose fetch steps fill data/raw
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/sources.yml') }}

      - name: Install
        run: uv sync --locked

      - name: Pipeline tests (network)
        run: uv run pytest -q

  e2e:
    # The viewer end to end on the Gamla stan + Riddarholmen fixture (HFH_FIXTURE=1, contract C1), with the
    # network job's triggers. City data goes to data/raw (kept between runs by the cache below) and is never
    # committed; no screenshots or traces are uploaded, because they show City data. 45 minutes: on a cold cache
    # the fixture asks Overpass two tiled queries, each with four tries 30, 60 and 120 s apart when it is slow.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache raw data  # the same key as the network job
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/sources.yml') }}

      - name: Install
        run: |
          uv sync --locked
          npm ci

      - name: Fixture pipeline (every step in STEPS, s99_validate included)
        env:
          HFH_FIXTURE: "1"
        run: uv run python -m pipeline.run

      - name: Golden check (rebuild the web steps and compare bytes)
        env:
          HFH_FIXTURE: "1"
        run: |
          v=$(python3 -c "import json;print(json.load(open('web/data/current.json'))['version'])")
          cp -R "web/data/$v" "$RUNNER_TEMP/first"
          uv run python -m pipeline.run s03_tiles s04_base s07_labels s14_search -- --version "$v"
          diff -r "$RUNNER_TEMP/first" "web/data/$v"

      - name: Web unit tests
        run: npm run test:web

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:e2e

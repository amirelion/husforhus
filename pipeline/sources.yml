# The City Museum's building-archaeology register (BR): s00_fetch_stadsmuseet, s02_stadsmuseet, the pinned card's
# "Building archaeology" section. The card states facts in our own words (never the register's descriptions) and
# links each record's report in Digitala Stadsmuseet; property designations are only a join key, never shipped. The
# register's records never set a year. A report it links may: a year we read in it and cite by hand
# (pipeline/gamla_stan_years.csv, source ssm_br; s99 checks the register links it), a period shown with "≈" and the
# report linked on the card; the report's text never enters the repository.
- id: stadsmuseet_br
  url: https://stadsarkeologisktregister.stockholm.se/
  api_url: https://stadsarkeologisktregister.stockholm.se/api      # brInvestigations, brInvestigations/{id}, brCategories
  wfs_url: https://stadsarkeologisktregister.stockholm.se/geoserver/sr/ows   # layer sr:v_area_br, EPSG:3011
  report_url: https://digitalastadsmuseet.stockholm.se/fotoweb/archives/5004-Dokument-och-publikationer/?BR={n}
  publisher: Stadsmuseet i Stockholm
  product: Stads- och byggnadsarkeologiskt register
  dataset: Stads- och byggnadsarkeologiskt register
  licence: LicenseRef-Permission
  licence_url: https://stadsarkeologisktregister.stockholm.se/
  terms: "written permission from Stadsmuseet, 2026-10-19: free use with the source credited"
  attribution: Stads- och byggnadsarkeologiskt register, Stadsmuseet i Stockholm (bearbetad / modified)
  modified: true   # facts from the records' fields and categories, years cited from its reports; never their texts
  status: confirmed


# Every dataset the pipeline uses (contract C6). Checked by pipeline/sources.py and by s99_validate.
# licence: SPDX id, one of CC-BY-4.0, CC-BY-SA-4.0, CC0-1.0, ODbL-1.0, LicenseRef-PublicDomain.
# feature (optional): a city.FEATURES switch; the source is credited (About, the corner) only while it is on.
# modified: required for CC-BY* and ODbL; true when we reproject, clip, simplify or join the data.
# attribution: for CC-BY*, ODbL it must contain the `product` string and the licence marker ("CC BY 4.0",
#         "CC BY-SA 4.0" or "ODbL"), and say "modified" or "bearbetad" when `modified` is true.
# status: confirmed, or pending-O1 until the City of Stockholm confirms the licence in writing.
#         `s99_validate --release` fails while any source is pending-O1.
# dataset: the name D44's credit line starts with, "Dataset: publisher, licence" (plus ", processed" / ", bearbetad"
#         when `modified` is true), as the publisher writes it, in both languages. Shown on About.
# credit_as (optional): {en, sv}, the source's own prescribed words, in the publisher's place in that line.
# licence_as (optional): the licence as the source asks to be credited, its name without the version ("CC BY").
# corner (optional): the source's words in the map's corner credit, {en, sv}, and the page they link to
#         (url; without one they open About at its sources). Sources with the same words appear once.

- id: city_lod1
  url: https://dataportalen.stockholm.se/dataportalen/Data/Stadsbyggnadskontoret/LOD1_stadsdelsnamnder_SHP.zip
  publisher: Stockholms stad, Stadsbyggnadskontoret
  product: SBK 3D-Byggnader (LOD1) generaliserade
  dataset: SBK 3D-Byggnader (LOD1) generaliserade
  credit_as: {en: "© Stockholms stad, Stadsbyggnadskontoret", sv: "© Stockholms stad, Stadsbyggnadskontoret"}
  licence_as: CC BY   # the City's own credit (its answer to O1, 2026-10-16)
  licence: CC-BY-4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  attribution: SBK 3D-Byggnader (LOD1) generaliserade, © Stockholms stad, Stadsbyggnadskontoret, CC BY 4.0 (bearbetad / modified)
  modified: true
  corner: {en: "© Stockholms stad", sv: "© Stockholms stad"}
  status: confirmed   # the City confirmed CC BY in writing, 2026-10-16; its credit: "© Stockholms stad, Stadsbyggnadskontoret, CC BY"

